aid: clarity-ai
name: Clarity AI
description: >-
  Clarity AI is a sustainability technology and fintech company that provides
  AI-powered extra-financial intelligence for financial decision-making. Its
  platform delivers ESG risk ratings, climate and physical-risk analytics,
  regulatory-compliance reporting (EU Taxonomy, SFDR, MiFID II, ESMA fund
  naming, Pillar 3), impact and UN SDG alignment, and retail-banking climate
  engagement tools. Clarity AI reports coverage of 300K+ listed and private
  companies, 450K+ funds, and 400+ sovereigns, and serves asset managers,
  asset owners, banks, wealth managers, and corporates. The company exposes its
  data through a web application, data feeds, APIs, and emerging AI agent / MCP
  integrations, though its developer surface is gated behind an enterprise
  platform login rather than a public developer portal. Clarity AI is a
  portfolio company of the SoftBank Vision Fund. This profile is maintained in
  the API Evangelist network.
